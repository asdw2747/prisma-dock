[package]
name = "prisma-dock"
version = "1.0.2"
edition = "2024"
license = "MIT"
description = "A lightweight cross-platform app hub and GitHub Releases updater."
readme = "README.md"
authors = ["Prisma Chill"]

[dependencies]
dirs = "6"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = [
    "ico",
    "jpeg",
    "png",
] }
open = "5"
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "rustls-tls",
] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
appimage-rs = { version = "0.3.2", features = ["xz", "zstd"] }

[target.'cfg(target_os = "windows")'.dependencies]
icoextract_rs = { version = "0.1.2", features = ["thumbnail"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
