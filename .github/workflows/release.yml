name: Build & Release Prisma Dock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: prisma-dock
  APP_NAME: PrismaDock

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows EXE
        run: cargo build --release
      - name: Stage Windows Release Asset
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -eq "main" -or [string]::IsNullOrWhiteSpace($tag)) { $tag = "1.0.0" }
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" "${{ env.BIN_NAME }}-$tag-windows-x86_64.exe"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ env.BIN_NAME }}-*-windows-x86_64.exe
            LICENSE
            README.md

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev fuse libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux Release Binary
        run: cargo build --release
      - name: Package AppImage
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then TAG="1.0.0"; fi

          mkdir -p AppDir/usr/bin
          cp "target/release/${BIN_NAME}" "AppDir/usr/bin/${BIN_NAME}"

          if [ -f assets/icon.png ]; then
            cp assets/icon.png "AppDir/${BIN_NAME}.png"
          else
            python3 -c "import zlib, struct; w=h=64; raw=b''.join(b'\x00'+b'\x38\xbd\xf8\xff'*w for _ in range(h)); chunk=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open('AppDir/${BIN_NAME}.png','wb').write(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))"
          fi
          ln -s "${BIN_NAME}.png" AppDir/.DirIcon

          cat << EOF > "AppDir/${BIN_NAME}.desktop"
          [Desktop Entry]
          Type=Application
          Name=Prisma Dock
          Comment=Cross-platform app hub and GitHub Releases updater
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Categories=Utility;
          Terminal=false
          EOF

          cat << EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/${BIN_NAME}" "\$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "${APP_NAME}-${TAG}-x86_64.AppImage"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ env.APP_NAME }}-*-x86_64.AppImage
